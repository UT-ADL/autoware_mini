local_path_length: 100          # m
braking_reaction_time: 1.6      # s
safety_box_width: 2.7           # m
wide_safety_box_width: 3.1      # m
narrow_safety_box_width: 2.5    # m
safety_box_length: 5.0          # m
waypoint_interval: 1.0          # m
default_acceleration: 1.0       # m/s2
default_deceleration: 1.0       # m/s2
max_deceleration: 10.0          # m/s2
stopped_speed_limit: 1.0        # m/s
lane_change_base_length: 10.0   # m
lane_change_perlane_length: 5.0 # m
speed_limit: 50.0               # max velocity for route (km/h), will be replaced by speed taken from map
publish_rate: 10                # Hz
output_frame: map
distance_to_goal_limit: 5.0     # m
ego_vehicle_stopped_speed_limit: 0.1
from_behind_heading_limit: 30   # degrees - max heading difference to consider trajectory coming from behind
default_left_width: 1.4         # m
default_right_width: 1.4        # m
enable_road_closures: True
parallel_paths: 9               # m
parallel_paths_interval: 0.3    # m
collision_point_interval: 1.0   # m - max segment length for densifying collision points

lanelet2_global_planner:
  distance_to_centerline_limit: 4.0
  enable_reroute: True
  reroute_limit: 15.0            # m
  reroute_frequency: 1.0         # s
  lane_change: False
  lanelet_search_radius: 0.5
  routing_cost: travel_time
  yield_slowdown_factor: 0.5     # fraction of speed_limit to use at yield lines

lanelet2_map_visualizer:
  use_map_extraction: False     # extract smaller map area around the ego vehicle for visualization
  map_extraction_distance: 500  # m - distance from ego vehicle to extract map data

waypoint_loader:
  output_frame: map

waypoint_saver:
  interval: 1.0

path_smoothing:
  adjust_speeds_in_curves: True
  adjust_speeds_using_deceleration: True
  speed_averaging_window: 21              # window size (will be applied only if > 1)
  adjust_endpoint_speed_to_zero: True
  radius_calc_neighbour_index: 8          # int
  lateral_acceleration_limit: 1.5         # m/s2
  output_debug_info: False

local_path_extractor:
  lookahead_distance: 10                  # m
  distance_to_lookahead_path_limit: 10.0  # m
  after_goal_obstacle_check_distance: 4.0 # m
collision_checker:
  parallel_checkers: false  # disabled due to GEOS prepared geometry thread-safety bug (libgeos/geos#825)
  goal_stop_checker:
    braking_safety_distance_goal: 0.1       # m
  traffic_light_stop_line_checker:
    braking_safety_distance_stop_line: 2     # m
    tfl_force_stop_speed_limit: 5.0         # km/h
    tfl_deceleration_limit: 3.0             # m/s2
  object_collision_checker:
    approaching_deceleration: 3.5           # m/s2
    shielded_deceleration: 3.0              # m/s2 - for objects behind a moving object on path
    braking_safety_distance_obstacle: 4     # m
  pedestrian_crosswalk_checker:
    braking_safety_distance_crosswalk: 4    # m
    crossing_angle_max_limit: 60            # degrees
    ignore_static_obstacles: True
    crosswalk_deceleration_limit: 3.0     # m/s2
    prediction_counter_min_limit: 4         # int
  yielding_checker:
    braking_safety_distance_yield: 1.0      # m
    yielding_distance_limit: 40.0           # m
    yielding_deceleration_limit: 3.0        # m/s2
  give_way_checker:
    braking_safety_distance_give_way: 4.0   # m
    give_way_deceleration_limit: 3.0        # m/s2
    give_way_counter_min_limit: 3           # int
    check_right_turn: True                  # bool
    check_left_turn: True                   # bool
  right_of_way_checker:
    braking_safety_distance_right_of_way: 1.0  # m
    right_of_way_deceleration_limit: 3.0     # m/s2
    heading_alignment_limit: 30.0           # degrees
    right_turn_check_range: 15.0            # m
  trajectory_collision_checker:
    trajectory_collision_deceleration: 3.0  # m/s2
    braking_safety_distance_trajectory: 4.0 # m
    safety_time_ego_front: 2.0              # s
    safety_time_ego_rear: 1.0               # s
    trajectory_counter_min_limit: 5         # int
    no_time_collision_check_distance: 10.0   # m
  manual_yield_checker:
    braking_safety_distance_stop_line: 0.95 # m
    keep_stop_line_for: 15.0                # s
  stop_sign_checker:
    braking_safety_distance_stop_sign: 1.0  # m
    stopping_distance: 2.0                  # m
  bus_stop_checker:
    braking_safety_distance_bus_stop: 0.0   # m
    bus_stop_deceleration_limit: 3.0        # m/s2
  lane_boundary_checker:
    braking_safety_distance_lane_boundary: 1.0 # m
    min_collision_point_distance: 4.0      # m
speed_planner:
  synchronization_queue_size: 4
  synchronization_slop: 0.15
swerve_planner:
  swerving_speed_tolerance: 1.0         # m/s
  swerving_counter_min_limit: 10
  distance_to_centerline_limit: 5.0     # m
  swerving_alignment_angle_limit: 25.0  # degrees
  swerving_blocked_speed_limit: 4.0     # m/s - don't swerve if following object faster than this
  synchronization_queue_size: 4
  synchronization_slop: 0.15
openpilot_local_planner:
  transform_timeout: 0.06
waypoint_assistance:
  assist_goal_clear_distance: 5.0  # m
  assistance_speed: 8.0         # km/h
  waypoint_size: 1.5    # clickable border square edge length in meters
  drawing_area_size: 1000.0  # meters; length of one edge of the square drawing area in RViz
