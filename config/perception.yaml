    min_roi_width: 15  # minimum ROI width in pixels, when classification makes sense
    rectify_image: False  # the distortions of Nvidia cameras are significant and rectification should be done by image_proc, since PinHoleCameraModel python doesn't have FishEye distortion model
    transform_timeout: 0.06
